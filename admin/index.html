<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin console · Gali Bazaar</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#F5F1FB;color:#1D0F30;font-size:14px}
button,input{font:inherit}a{color:inherit}
.app{display:flex;min-height:100vh}
.side{width:236px;background:#1D0F30;color:#CFC6E3;padding:22px 16px;flex-shrink:0;position:sticky;top:0;height:100vh}
.logo{background:#fff;border-radius:12px;padding:8px 14px;display:inline-block;font-weight:800;font-size:20px;color:#1D0F30}
.logo .g{color:#6D28D9}.logo .d{color:#EC4899}
.side small{display:block;letter-spacing:1.5px;font-size:10.5px;margin:10px 0 26px 6px;color:#8E84A8}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;text-decoration:none;margin-bottom:4px;cursor:pointer}
.nav a:hover{background:#2A1A44}.nav a.on{background:linear-gradient(90deg,#A855F7,#EC4899);color:#fff;font-weight:600}
.main{flex:1;padding:30px 30px 60px;min-width:0}
h1{font-size:26px;margin:0}.sub{color:#6B6380;font-size:13px;margin-top:4px}
.top{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}.top .sp{flex:1}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:600;cursor:pointer}
.pink{background:linear-gradient(90deg,#EF287B,#FF5A7A);color:#fff}.dark{background:#1D0F30;color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px}
.ghost{background:#fff;border:1px solid #E6DEF2}
.card{background:#fff;border-radius:22px;padding:8px 18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(29,15,48,.04)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.6px;color:#8E84A8;font-weight:600;padding:14px 8px;border-bottom:1px solid #F0EAF7}
td{padding:12px 8px;border-bottom:1px solid #F5F1FA;vertical-align:middle}tr:last-child td{border-bottom:0}
tr.drag{opacity:.4}.hand{cursor:grab;color:#C4BAD6;user-select:none}
.ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}.ic img{width:26px;height:26px}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;margin-left:6px}.t-none{background:#E6F8EE;color:#15803D}.t-draft{background:#F0EEF4;color:#6B6380}
.tog{width:42px;height:24px;border-radius:20px;background:#DDD6E8;position:relative;cursor:pointer;border:0;flex-shrink:0}
.tog::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}
.tog.on{background:#16A34A}.tog.on::after{left:21px}
.edit{color:#7C3AED;font-weight:600;cursor:pointer;background:none;border:0}
.req{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #F5F1FA}.req:last-child{border:0}.req b{flex:1}.req span{color:#8E84A8;font-size:12px}
.panel{position:fixed;right:20px;top:20px;bottom:20px;width:380px;background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(29,15,48,.18);padding:0 22px 22px;overflow:auto;display:none;z-index:40}
.panel.open{display:block}.panel h2{margin:0 -22px 12px;padding:18px 22px 12px;font-size:20px;display:flex;align-items:center;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid #F0EAF7}.panel h2 span{flex:1}.x{background:#F3F0F8;border:0;font-size:22px;cursor:pointer;color:#1D0F30;width:38px;height:38px;border-radius:50%;line-height:1}
label{display:block;font-size:11px;letter-spacing:.6px;font-weight:600;color:#6B6380;margin:14px 0 6px}
.in{width:100%;border:1px solid #E6DEF2;border-radius:12px;padding:11px 13px}.in:focus{outline:none;border-color:#8B5CF6}
.icons{display:flex;flex-wrap:wrap;gap:8px}.icons button{width:44px;height:44px;border-radius:12px;border:1.5px solid #EEE7F6;background:#FAF7FD;cursor:pointer;padding:0}
.icons button img{width:28px;height:28px}.icons button.on{border:2px solid #F08A1A;background:#FFF3E2}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:9px;border:1.5px solid #E6DEF2;cursor:pointer}.sw button.on{outline:2px solid #1D0F30;outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #E6DEF2;border-radius:20px;padding:5px 11px;font-size:12.5px;cursor:pointer}.chip.add{border:1.5px dashed #EF287B;color:#EF287B}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #F5F1FA;margin-top:12px}.row div{flex:1}.row b{display:block;font-size:13.5px}.row span{font-size:11.5px;color:#8E84A8}
.note{background:#F3EDFF;color:#6D28D9;border-radius:12px;padding:10px 12px;font-size:12px;margin:14px 0}
.full{width:100%;padding:14px}
.msg{margin:8px 0;font-size:12.5px}.err{color:#DC2626}.ok{color:#16A34A}
.login{max-width:380px;margin:12vh auto;background:#fff;border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(29,15,48,.1)}
.login h1{font-size:22px;margin:18px 0 6px}
.soon{background:#fff;border-radius:22px;padding:40px;text-align:center;color:#6B6380}
body.po .main{padding-right:430px}
@media(max-width:900px){body.po .main{padding-right:18px}}
.mtop{display:none}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}.kpi{background:#fff;border-radius:20px;padding:16px 18px}
.kpi span{font-size:12.5px;color:#6B6380}.kpi b{display:block;font-size:26px;margin:6px 0 2px}.kpi small{font-size:11.5px;font-weight:600}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.box{background:#fff;border-radius:22px;padding:16px 18px;margin-bottom:16px;overflow-x:auto}.box h3{margin:0 0 10px;font-size:16px}.box h3 span{color:#8E84A8;font-weight:400;font-size:12px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;white-space:nowrap}.ok{background:#E6F8EE;color:#15803D}.warn{background:#FFF1DC;color:#B45309}.bad{background:#FFE4EC;color:#BE185D}.grey{background:#F0EEF4;color:#6B6380}
.mini{border:1px solid #E6DEF2;background:#fff;border-radius:9px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;margin-left:4px}.mini.dk{background:#1D0F30;color:#fff;border-color:#1D0F30}
.search{border:1px solid #E6DEF2;border-radius:12px;padding:9px 12px;width:260px;max-width:100%}
.docs a{display:inline-block;margin-right:8px;color:#7C3AED;font-size:12px;font-weight:600;cursor:pointer}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:900px){
 .app{display:block}.side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
 .side.open{transform:none}.scrim{display:none;position:fixed;inset:0;background:rgba(29,15,48,.4);z-index:15}.scrim.open{display:block}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:#1D0F30;padding:12px 14px}
 .mtop button{background:none;border:0;color:#fff;font-size:24px;line-height:1;cursor:pointer;padding:2px 6px}.mtop .logo{font-size:17px;padding:6px 11px}
 .mtop small{color:#CFC6E3;margin-left:auto;font-size:12px}
 .main{padding:16px 12px 60px}.top{flex-wrap:wrap}.top .sp{display:none}.top .btn{width:100%}h1{font-size:22px}
 .card{padding:4px 10px}th.hi,td.hi,th.hand,td.hand{display:none}td,th{padding:10px 4px}td b{font-size:13.5px}.tag{display:inline-block;margin:4px 0 0}
 .panel{left:8px;right:8px;top:8px;bottom:8px;width:auto}
}
</style></head><body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB = "https://airbbnopqgubftqjzkjr.supabase.co", KEY = "sb_publishable_fImHal0lfTgi_3jCJ9w67Q_6-JB4US1";
const db = supabase.createClient(SB, KEY);
const ICONS = "shopping_cart basket bread croissant cookie doughnut candy lollipop chocolate_bar custard honey_pot leafy_green coconut peanuts sheaf_of_rice salt glass_of_milk cup_with_straw dumpling oden takeout_box pencil notebook pill package wrapped_gift shopping_bags".split(" ");
const COLORS = ["#FFF0D6", "#D5F3C9", "#FCD9E6", "#DDEBFF", "#EFE6FF", "#FFE7A3", "#FFDCC8", "#D9F5F1"];
const NAV = [["dashboard","Dashboard"],["sellers","Sellers"],["kyc","KYC queue"],["payments","Payments"],["categories","Categories"],["featured","Featured shops"],["sales","Sales team"],["complaints","Complaints"],["festivals","Festivals"],["blocked","Blocked items"],["settings","Settings"]];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const iconSrc = i => /^https?:/.test(i) ? i : `/img/art/${i}.webp`;
const LOGO = '<span class="logo"><span class="g">गली</span> Bazaar<span class="d">.</span></span>';
let page = (location.hash || "#dashboard").slice(1), cats = [], counts = {}, reqs = [], form = null;

async function start() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return loginView();
  const { data: me } = await db.from("profiles").select("role,name,email").eq("id", session.user.id).single();
  if (!me || me.role !== "admin") {
    $("#root").innerHTML = `<div class="login">${LOGO}<h1>Not an admin account</h1><p class="sub">${esc(session.user.email)} is not set as admin.</p>
      <button class="btn ghost" onclick="db.auth.signOut().then(()=>location.reload())">Sign out</button></div>`;
    return;
  }
  shell(); go(page);
}

function loginView() {
  let sent = false;
  $("#root").innerHTML = `<div class="login">${LOGO}<h1>Admin console</h1><p class="sub">Sign in with the admin email. We send a code.</p>
    <label>EMAIL</label><input class="in" id="em" type="email" placeholder="admin email">
    <div id="cw" style="display:none"><label>CODE FROM YOUR EMAIL</label><input class="in" id="cd" inputmode="numeric" maxlength="10"></div>
    <div class="msg" id="lm"></div><button class="btn pink full" id="lb">Get code</button></div>`;
  $("#lb").onclick = async () => {
    const email = $("#em").value.trim().toLowerCase(), m = $("#lm");
    m.textContent = ""; $("#lb").disabled = true;
    if (!sent) {
      const { error } = await db.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
      if (error) { m.className = "msg err"; m.textContent = error.message; }
      else { sent = true; $("#cw").style.display = "block"; $("#lb").textContent = "Verify & sign in"; m.className = "msg ok"; m.textContent = "Code sent. Check Inbox / Spam."; }
    } else {
      const { error } = await db.auth.verifyOtp({ email, token: $("#cd").value.trim(), type: "email" });
      if (error) { m.className = "msg err"; m.textContent = "Wrong or expired code."; } else return start();
    }
    $("#lb").disabled = false;
  };
}

function shell() {
  $("#root").innerHTML = `<div class="app"><aside class="side">${LOGO}<small>ADMIN CONSOLE</small><nav class="nav">
    ${NAV.map(([k, l]) => `<a data-k="${k}" href="#${k}">${l}</a>`).join("")}
    <a onclick="db.auth.signOut().then(()=>location.reload())" style="margin-top:20px">Sign out</a></nav></aside>
    <main class="main" id="main"></main></div><div class="panel" id="panel"></div><div class="scrim" id="scrim" onclick="menu(false)"></div>`;
  document.querySelector(".app").insertAdjacentHTML("afterbegin", `<div class="mtop"><button onclick="menu(true)" aria-label="Menu">☰</button>${LOGO}<small>Admin console</small></div>`);
  window.onhashchange = () => go(location.hash.slice(1));
}

function menu(open) { $(".side").classList.toggle("open", open); $("#scrim").classList.toggle("open", open); }
function go(k) {
  page = k || "categories"; menu(false);
  document.querySelectorAll(".nav a[data-k]").forEach(a => a.classList.toggle("on", a.dataset.k === page));
  if (page === "categories") return loadCats();
  const pages = { dashboard: dash, sellers, kyc, payments, featured, sales, complaints, festivals };
  if (pages[page]) { $("#main").innerHTML = `<div class="sub">Loading…</div>`; return pages[page]().catch(e => $("#main").innerHTML = `<div class="soon err">${esc(e.message || e)}</div>`); }
  const label = (NAV.find(n => n[0] === page) || ["", "This page"])[1];
  $("#main").innerHTML = `<div class="top"><div><h1>${label}</h1></div></div>
    <div class="soon"><b>Coming to the web console soon.</b><br>Until then, use the Admin panel inside the Gali Bazaar app (same admin email).</div>`;
}


// ---------------- shared ----------------
const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const today = () => new Date().toISOString().slice(0, 10);
const live = s => s.kyc === "APPROVED" && s.sub_until && s.sub_until >= today() && !s.quality_hold;
const score = s => { const c = s.kyc_report?.checks; if (!c?.length) return null; return Math.round(100 * c.filter(x => x.ok).length / c.length); };
async function q(t, sel, mod) { let x = db.from(t).select(sel || "*"); if (mod) x = mod(x); const { data, error } = await x; if (error) throw error; return data || []; }
function head(title, sub, right = "") { return `<div class="top"><div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div><div class="sp"></div>${right}</div>`; }

// ---------------- Dashboard ----------------
async function dash() {
  const since = new Date(Date.now() - 6 * 864e5).toISOString().slice(0, 10), m0 = today().slice(0, 8) + "01";
  const [shops, claims, orders, comm, sp] = await Promise.all([
    q("shops", "id,name,owner,type,kyc,kyc_report,sub_until,quality_hold,created_at,pan_name,referred_by"),
    q("pay_claims", "*", x => x.order("created_at", { ascending: false }).limit(300)),
    q("orders", "id", x => x.gte("created_at", today())),
    q("commissions", "sales,amount"),
    q("sales_people", "id,name,code,commission_pct"),
  ]);
  const paidShops = new Set(claims.filter(c => c.status === "APPROVED" && (c.purpose || "PLAN") === "PLAN").map(c => c.shop));
  const act = shops.filter(live), trial = act.filter(s => !paidShops.has(s.id)), inact = shops.filter(s => s.kyc === "APPROVED" && !live(s));
  const month = claims.filter(c => c.status === "APPROVED" && c.paid_on >= m0).reduce((a, c) => a + Number(c.amount), 0);
  const days = [...Array(7)].map((_, i) => new Date(Date.now() - (6 - i) * 864e5).toISOString().slice(0, 10));
  const rev = days.map(d => claims.filter(c => c.status === "APPROVED" && c.paid_on === d).reduce((a, c) => a + Number(c.amount), 0));
  const kq = shops.filter(s => s.kyc === "PENDING");
  const h = new Date().getHours(), hi = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  const max = Math.max(1, ...rev), pts = rev.map((v, i) => `${10 + i * 80},${150 - v / max * 130}`).join(" ");
  const bySales = sp.map(p => ({ ...p, amt: comm.filter(c => c.sales === p.id).reduce((a, c) => a + Number(c.amount), 0), n: shops.filter(s => s.referred_by === p.id).length }));
  $("#main").innerHTML = head(`${hi}, Admin`, new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "short" }) + " • All India") + `
  <div class="kpis">
    <div class="kpi"><span>Active shops</span><b>${act.length}</b><small style="color:#16A34A">${shops.filter(s => s.created_at >= since).length} joined this week</small></div>
    <div class="kpi"><span>On free trial</span><b>${trial.length}</b><small style="color:#B45309">${trial.filter(s => s.sub_until <= new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10)).length} end this week</small></div>
    <div class="kpi"><span>Inactive</span><b>${inact.length}</b><small style="color:#BE185D">plan / trial ended</small></div>
    <div class="kpi"><span>Revenue this month</span><b>${inr(month)}</b><small style="color:#6B6380">approved payments</small></div>
    <div class="kpi"><span>Orders today</span><b>${orders.length}</b><small style="color:#6B6380">all shops</small></div></div>
  <div class="grid2"><div class="box"><h3>KYC queue <span>• auto-checker</span> <a href="#kyc" style="float:right;color:#EF287B;font-size:13px">View all ${kq.length}</a></h3>${kycTable(kq.slice(0, 5))}</div>
    <div class="box"><h3>Revenue (₹, last 7 days)</h3><svg viewBox="0 0 500 160" style="width:100%;height:170px"><polyline fill="none" stroke="#8B5CF6" stroke-width="3" points="${pts}"/>
      ${rev.map((v, i) => `<circle cx="${10 + i * 80}" cy="${150 - v / max * 130}" r="4" fill="#EF287B"/>`).join("")}</svg>
      <div class="sub" style="display:flex;justify-content:space-between">${days.map(d => `<span>${d.slice(8)}</span>`).join("")}</div></div></div>
  <div class="grid3">
    <div class="box"><h3>Payments <span>• latest</span></h3>${claimTable(claims.filter(c => (c.purpose || "PLAN") === "PLAN").slice(0, 5), shops, false)}</div>
    <div class="box"><h3>Featured requests <span>• Be #1 boost</span></h3>${claimTable(claims.filter(c => c.purpose === "FEATURED" && c.status === "PENDING").slice(0, 5), shops, true) || '<div class="sub">No requests.</div>'}</div>
    <div class="box"><h3>Sales team <span>• lifetime commission</span></h3>${bySales.map(p => `<div class="req"><b>${esc(p.name)}<br><span class="sub">${p.n} sellers onboarded</span></b><b style="flex:0;color:#16A34A">${inr(p.amt)}</b></div>`).join("") || '<div class="sub">No sales people yet.</div>'}</div></div>`;
}

function kycTable(list) {
  if (!list.length) return '<div class="sub">Nothing waiting. 🎉</div>';
  return `<table><thead><tr><th>SHOP</th><th>OWNER (PAN NAME)</th><th>TYPE</th><th>AUTO SCORE</th><th>STATUS</th><th></th></tr></thead><tbody>${list.map(s => {
    const sc = score(s), cls = sc == null ? "grey" : sc >= 90 ? "ok" : "warn";
    return `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.pan_name || "")}</td><td>${esc(s.type)}</td><td><b style="color:${sc >= 90 ? "#16A34A" : "#B45309"}">${sc == null ? "—" : sc + "%"}</b></td>
      <td><span class="pill ${cls}">${sc == null ? "Checking" : sc >= 90 ? "Looks good" : "Review"}</span></td>
      <td style="white-space:nowrap"><button class="mini" onclick="docs('${s.id}')">Docs</button><button class="mini dk" onclick="kycSet('${s.id}','APPROVED')">Approve</button><button class="mini" onclick="kycSet('${s.id}','REJECTED')">Reject</button></td></tr>`;
  }).join("")}</tbody></table>`;
}
async function kycSet(id, st) {
  const reason = st === "REJECTED" ? prompt("Reason (the shop sees this)") : null;
  if (st === "REJECTED" && !reason) return;
  const { error } = await db.from("shops").update({ kyc: st, kyc_reason: reason }).eq("id", id);
  if (error) alert(error.message); else go(page);
}
async function docs(id) {
  const [s] = await q("shops", "name,kyc_files,pan_number,aadhaar_last4,kyc_report", x => x.eq("id", id));
  const links = await Promise.all(Object.entries(s.kyc_files || {}).map(async ([k, path]) => {
    const { data } = await db.storage.from("kyc").createSignedUrl(path, 600); return `<a href="${data?.signedUrl}" target="_blank">${esc(k)}</a>`;
  }));
  const checks = (s.kyc_report?.checks || []).map(c => `<div>${c.ok ? "✓" : "✗"} ${esc(c.name)}: ${esc(c.note)}</div>`).join("");
  const p = $("#panel"); p.classList.add("open"); document.body.classList.add("po");
  p.innerHTML = `<h2><span>${esc(s.name)}</span><button class="x" onclick="closeForm()">×</button></h2><div class="sub">PAN ${esc(s.pan_number || "—")} · Aadhaar XXXX ${esc(s.aadhaar_last4 || "")}</div>
    <label>DOCUMENTS (links work 10 minutes)</label><div class="docs">${links.join("") || "None"}</div><label>AUTO-CHECK</label><div class="sub">${checks || "No report"}</div>
    <div style="margin-top:16px"><button class="btn pink" onclick="kycSet('${id}','APPROVED');closeForm()">Approve</button> <button class="btn ghost" onclick="kycSet('${id}','REJECTED');closeForm()">Reject</button></div>`;
}
function claimTable(list, shops, featured) {
  if (!list.length) return "";
  const nm = id => esc(shops.find(s => s.id === id)?.name || "Shop");
  return `<table><thead><tr><th>SHOP</th><th>${featured ? "DAYS" : "PLAN"}</th><th>AMOUNT</th><th>STATUS</th>${featured || list.some(c => c.status === "PENDING") ? "<th></th>" : ""}</tr></thead><tbody>${list.map(c => `<tr>
    <td>${nm(c.shop)}<br><span class="sub">UTR ${esc(c.utr)}</span></td><td>${featured ? (c.days || "") + " days" : c.months + " month" + (c.months > 1 ? "s" : "")}</td><td><b>${inr(c.amount)}</b></td>
    <td><span class="pill ${c.status === "APPROVED" ? "ok" : c.status === "PENDING" ? "warn" : "bad"}">${c.status === "APPROVED" ? "Paid" : c.status === "PENDING" ? "Check" : "Rejected"}</span></td>
    ${c.status === "PENDING" ? `<td style="white-space:nowrap"><button class="mini dk" onclick="claimOk('${c.id}')">Approve</button><button class="mini" onclick="claimNo('${c.id}')">Decline</button></td>` : (featured ? "<td></td>" : "")}</tr>`).join("")}</tbody></table>`;
}
async function claimOk(id) { const { error } = await db.rpc("approve_claim", { p_claim: id }); if (error) alert(error.message); else go(page); }
async function claimNo(id) { const r = prompt("Reason (the shop sees this)"); if (!r) return; const { error } = await db.from("pay_claims").update({ status: "REJECTED", reason: r }).eq("id", id); if (error) alert(error.message); else go(page); }

// ---------------- Sellers ----------------
async function sellers() {
  const shops = await q("shops", "id,name,type,city,locality,phone,kyc,sub_until,quality_hold,created_at", x => x.order("created_at", { ascending: false }));
  const draw = f => {
    const t = (f || "").toLowerCase(), list = shops.filter(s => !t || (s.name + " " + s.city + " " + s.locality + " " + s.phone).toLowerCase().includes(t));
    $("#tb2").innerHTML = list.map(s => `<tr><td><b>${esc(s.name)}</b><br><span class="sub">${esc(s.type)}</span></td><td>${esc(s.locality)}, ${esc(s.city)}</td><td>${esc(s.phone)}</td>
      <td><span class="pill ${live(s) ? "ok" : s.kyc !== "APPROVED" ? "warn" : "bad"}">${live(s) ? "Live till " + s.sub_until : s.kyc !== "APPROVED" ? "KYC " + s.kyc.toLowerCase() : "Inactive"}</span></td><td>${(s.created_at || "").slice(0, 10)}</td></tr>`).join("");
  };
  $("#main").innerHTML = head("Sellers", `${shops.length} shops · ${shops.filter(live).length} live`, `<input class="search" placeholder="Search name, city, phone" oninput="window._sd(this.value)">`) +
    `<div class="box"><table><thead><tr><th>SHOP</th><th>AREA</th><th>PHONE</th><th>STATUS</th><th>JOINED</th></tr></thead><tbody id="tb2"></tbody></table></div>`;
  window._sd = draw; draw("");
}
async function kyc() {
  const [shops, riders] = await Promise.all([q("shops", "*", x => x.eq("kyc", "PENDING")), q("riders", "id,name,phone,kyc,shop", x => x.eq("kyc", "PENDING"))]);
  $("#main").innerHTML = head("KYC queue", `${shops.length} shops · ${riders.length} delivery partners waiting`) + `<div class="box"><h3>Shops</h3>${kycTable(shops)}</div>
    <div class="box"><h3>Delivery partners</h3>${riders.length ? `<table><tbody>${riders.map(r => `<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.phone)}</td>
      <td style="white-space:nowrap"><button class="mini dk" onclick="riderKyc('${r.id}','APPROVED')">Approve</button><button class="mini" onclick="riderKyc('${r.id}','REJECTED')">Reject</button></td></tr>`).join("")}</tbody></table>` : '<div class="sub">None.</div>'}</div>`;
}
async function riderKyc(id, st) { const reason = st === "REJECTED" ? prompt("Reason") : null; if (st === "REJECTED" && !reason) return;
  const { error } = await db.from("riders").update({ kyc: st, kyc_reason: reason }).eq("id", id); if (error) alert(error.message); else go(page); }
async function payments() {
  const [claims, shops] = await Promise.all([q("pay_claims", "*", x => x.eq("purpose", "PLAN").order("created_at", { ascending: false }).limit(200)), q("shops", "id,name")]);
  $("#main").innerHTML = head("Payments", `${claims.filter(c => c.status === "PENDING").length} waiting to be checked`) + `<div class="box">${claimTable(claims, shops, false) || '<div class="sub">No payments yet.</div>'}</div>`;
}
async function featured() {
  const [claims, shops] = await Promise.all([q("pay_claims", "*", x => x.eq("purpose", "FEATURED").order("created_at", { ascending: false }).limit(100)), q("shops", "id,name,featured_until")]);
  const on = shops.filter(s => s.featured_until && s.featured_until >= today());
  $("#main").innerHTML = head("Featured shops", `${on.length} featured now`) + `<div class="box"><h3>Requests</h3>${claimTable(claims, shops, true) || '<div class="sub">No requests.</div>'}</div>
    <div class="box"><h3>Featured now</h3>${on.map(s => `<div class="req"><b>${esc(s.name)}</b><span>till ${s.featured_until}</span></div>`).join("") || '<div class="sub">None.</div>'}</div>`;
}
async function sales() {
  const [sp, comm, shops] = await Promise.all([q("sales_people", "*"), q("commissions", "sales,amount,status"), q("shops", "id,referred_by")]);
  $("#main").innerHTML = head("Sales team", "Commission on every plan payment of shops from their code") + `<div class="box"><table><thead><tr><th>NAME</th><th>USERNAME</th><th>CODE</th><th>SHOPS</th><th>EARNED</th><th>PENDING</th><th>UPI</th><th></th></tr></thead><tbody>${sp.map(p => {
    const mine = comm.filter(c => c.sales === p.id);
    return `<tr><td><b>${esc(p.name)}</b><br><span class="sub">${esc(p.email || "")}</span></td>
      <td>${p.username ? `<b>${esc(p.username)}</b>` : `<span class="pill grey">Not set yet</span>`}<br><button class="mini" style="margin:4px 0 0" onclick='spLogin(${JSON.stringify({ id: p.id, name: p.name, username: p.username || "", signed: !!p.profile }).replace(/'/g, "&#39;")})'>Change login</button></td>
      <td>${esc(p.code)} · ${p.commission_pct}%</td><td>${shops.filter(s => s.referred_by === p.id).length}</td>
      <td>${inr(mine.reduce((a, c) => a + Number(c.amount), 0))}</td><td><b style="color:#6D28D9">${inr(mine.filter(c => c.status === "DUE").reduce((a, c) => a + Number(c.amount), 0))}</b></td><td>${esc(p.upi || "—")}</td>
      <td>${p.active === false ? `<span class="pill grey">Removed</span><button class="mini" onclick="spSet('${p.id}',true)">Restore</button>` : `<button class="mini" style="color:#BE185D" onclick="spSet('${p.id}',false)">Remove</button>`}</td></tr>`; }).join("")}</tbody></table>
    <div class="sub" style="margin-top:10px">Sales panel for them: <b>galibazaar.site/sales</b> (also linked in the website footer as “Sales team login”). First time they sign in with the email you added here, then create a username + password. Add people and send payouts (with TDS) from the Admin panel in the app.</div></div>`;
}
function spLogin(p) {
  const el = $("#panel"); el.classList.add("open"); document.body.classList.add("po");
  el.innerHTML = `<h2><span>Login · ${esc(p.name)}</span><button class="x" onclick="closeForm()" aria-label="Close">×</button></h2>
    ${p.signed ? "" : `<div class="note">${esc(p.name)} hasn't signed in even once. They must first open galibazaar.site/sales and sign in with the email code — then you can set a password here.</div>`}
    <label>USERNAME</label><input class="in" id="lu" value="${esc(p.username)}" placeholder="e.g. rahul.sales" autocomplete="off">
    <label>NEW PASSWORD <span style="font-weight:400">(leave empty to keep the old one)</span></label><input class="in" id="lp" type="text" placeholder="min 8 characters" autocomplete="off">
    <div class="note">Tell the new username / password to ${esc(p.name)} directly. Passwords are stored encrypted — nobody can see the old one, you can only set a new one.</div>
    <div class="msg" id="lmsg"></div>
    <button class="btn pink full" onclick="spLoginSave('${p.id}')">Save login</button>`;
}
async function spLoginSave(id) {
  const m = $("#lmsg");
  const { error } = await db.rpc("admin_sales_set_login", { p_sales: id, p_username: $("#lu").value.trim(), p_password: $("#lp").value });
  if (error) { m.className = "msg err"; m.textContent = /function/.test(error.message) ? "Run update-25-sales-web-login.sql in Supabase first." : error.message; return; }
  closeForm(); go(page);
}
async function spSet(id, on) {
  if (!on && !confirm("Remove this sales person? Their code stops working for new shops. Commission already earned stays and can still be paid out.")) return;
  const { error } = await db.from("sales_people").update({ active: on }).eq("id", id);
  if (error) alert(error.message); else go(page);
}
async function complaints() {
  const [list, shops] = await Promise.all([q("complaints", "*", x => x.order("created_at", { ascending: false }).limit(100)), q("shops", "id,name")]);
  $("#main").innerHTML = head("Complaints", `${list.filter(c => !c.reply).length} waiting for the shop's reply`) + `<div class="box"><table><thead><tr><th>DATE</th><th>SHOP</th><th>PROBLEM</th><th>STATUS</th></tr></thead><tbody>${list.map(c => `<tr>
    <td>${(c.created_at || "").slice(0, 10)}</td><td>${esc(shops.find(s => s.id === c.shop)?.name || "")}</td><td>${esc(c.reason)}<br><span class="sub">${esc((c.items || []).join(", "))}</span></td>
    <td><span class="pill ${c.reply ? "ok" : "warn"}">${c.reply ? "Replied" : "Open"}</span></td></tr>`).join("")}</tbody></table></div>`;
}

// ---------------- Festivals ----------------
const FEST_KEYS = ["diwali","holi","eid","christmas","navratri","ganesh","india","sankranti","rakhi","chhath","igas","phooldei","harela","ghughutiya"];
async function festivals() {
  const today = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  const { data, error } = await db.from("festivals").select("*").gte("day", today).order("day");
  if (error) throw error;
  const hasCols = (data || []).length === 0 || "show_chips" in data[0];
  $("#main").innerHTML = head("Festivals", "Festival look shows in the app from 2 days before the date and ends after the festival day") +
    (hasCols ? "" : `<div class="soon err" style="padding:16px;margin-bottom:14px">Run <b>update-24-festival-switch.sql</b> in Supabase to use the on/off switches.</div>`) +
    `<div class="box"><table><thead><tr><th>DATE</th><th>FESTIVAL</th><th>THEME</th><th>FESTIVAL LOOK</th><th>ITEM CHIPS</th><th></th></tr></thead><tbody>${(data || []).map(f => `<tr>
      <td>${esc(f.day)}</td><td><b>${esc(f.name)}</b><br><span class="sub">${esc(f.greeting || "")}</span></td><td>${esc(f.theme)}</td>
      <td><button class="tog ${f.active !== false ? "on" : ""}" onclick="festSet('${f.id}','active',${f.active === false})" aria-label="Festival look"></button></td>
      <td><button class="tog ${f.show_chips !== false ? "on" : ""}" onclick="festSet('${f.id}','show_chips',${f.show_chips === false})" aria-label="Item chips"></button></td>
      <td><button class="btn ghost" onclick="festDel('${f.id}','${esc(f.name).replace(/'/g, "")}')">Delete</button></td></tr>`).join("")}</tbody></table>
      <div class="sub" style="margin-top:10px">Item chips (Diyas, Sweets…) show only when nearby sellers actually have those items. Switch them off here to hide them completely.</div></div>
    <div class="box" style="margin-top:14px"><h3>Add festival</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input class="in" id="fn" placeholder="Name e.g. Diwali" style="flex:1;min-width:140px">
        <input class="in" id="fd" type="date" style="flex:1;min-width:140px">
        <select class="in" id="ft" style="flex:1;min-width:120px">${FEST_KEYS.map(k => `<option>${k}</option>`).join("")}</select>
        <input class="in" id="fg" placeholder="Greeting (optional)" style="flex:2;min-width:180px">
        <button class="btn pink" onclick="festAdd()">Add</button></div><div class="msg" id="fm"></div></div>`;
}
async function festSet(id, col, val) {
  const { error } = await db.from("festivals").update({ [col]: val }).eq("id", id);
  if (error) alert(error.message); festivals();
}
async function festDel(id, name) {
  if (!confirm("Delete " + name + "?")) return;
  const { error } = await db.from("festivals").delete().eq("id", id);
  if (error) alert(error.message); festivals();
}
async function festAdd() {
  const name = $("#fn").value.trim(), day = $("#fd").value;
  if (!name || !day) { $("#fm").className = "msg err"; $("#fm").textContent = "Enter name and date"; return; }
  const { error } = await db.from("festivals").insert({ name, day, theme: $("#ft").value, greeting: $("#fg").value.trim() || null });
  if (error) { $("#fm").className = "msg err"; $("#fm").textContent = error.message; return; }
  festivals();
}

// ---------------- Categories ----------------
async function loadCats() {
  $("#main").innerHTML = `<div class="sub">Loading…</div>`;
  const [c, n, r] = await Promise.all([
    db.from("categories").select("*").order("sort"),
    db.rpc("admin_category_counts"),
    db.rpc("admin_category_requests"),
  ]);
  if (c.error) { $("#main").innerHTML = `<div class="soon err">Couldn't load categories: ${esc(c.error.message)}<br>Run update-19-categories.sql in Supabase first.</div>`; return; }
  cats = c.data || []; counts = {}; (n.data || []).forEach(x => counts[x.key] = x.shops); reqs = r.data || [];
  renderCats();
}

function renderCats() {
  $("#main").innerHTML = `<div class="top"><div><h1>Shop categories</h1><div class="sub">Shown in the customer app, seller sign-up and website — changes go live instantly, no app update</div></div>
    <div class="sp"></div><button class="btn pink" onclick="openForm()">＋ Add category</button></div>
    <div class="card"><table><thead><tr><th class="hand"></th><th>ICON</th><th>NAME</th><th class="hi">HINDI</th><th>SHOPS</th><th>VISIBLE</th><th></th></tr></thead><tbody id="tb">
    ${cats.map(c => `<tr draggable="true" data-k="${c.key}"><td class="hand">⋮⋮</td>
      <td><div class="ic" style="background:${esc(c.color)}"><img src="${esc(iconSrc(c.icon))}" alt=""></div></td>
      <td><b>${esc(c.name)}</b>${!c.visible ? '<span class="tag t-draft">Draft</span>' : (counts[c.key] || 0) === 0 ? '<span class="tag t-none">No shops yet</span>' : ""}</td>
      <td class="hi">${esc(c.name_hi || "")}</td><td><b>${counts[c.key] ?? 0}</b></td>
      <td><button class="tog ${c.visible ? "on" : ""}" onclick="flag('${c.key}', ${!c.visible})" aria-label="Show to customers"></button></td>
      <td><button class="edit" onclick="openForm('${c.key}')">Edit</button></td></tr>`).join("")}
    </tbody></table></div>
    <div class="card" style="padding:16px 18px"><b>Requested by shops</b> <span class="sub">· from "Request new" in sign-up</span>
      ${reqs.length ? reqs.map(r => `<div class="req"><b>${esc(r.name)}</b><span>${r.asked} shop${r.asked == 1 ? "" : "s"} asked</span>
        <button class="btn dark" onclick='openForm(null, ${JSON.stringify(r.name).replace(/'/g, "&#39;")})'>Create</button></div>`).join("")
        : `<div class="sub" style="padding:12px 0">No requests yet.</div>`}</div>`;
  dragSort();
}

function dragSort() {
  let from = null;
  document.querySelectorAll("#tb tr").forEach(tr => {
    tr.ondragstart = () => { from = tr; tr.classList.add("drag"); };
    tr.ondragend = () => tr.classList.remove("drag");
    tr.ondragover = e => { e.preventDefault(); if (from && from !== tr) { const r = tr.getBoundingClientRect(); tr.parentNode.insertBefore(from, e.clientY > r.top + r.height / 2 ? tr.nextSibling : tr); } };
    tr.ondrop = async () => {
      const keys = [...document.querySelectorAll("#tb tr")].map(x => x.dataset.k);
      const { error } = await db.rpc("admin_reorder_categories", { p_keys: keys });
      if (error) alert(error.message); else loadCats();
    };
  });
}

async function flag(key, visible) {
  const { error } = await db.rpc("admin_category_flag", { p_key: key, p_visible: visible, p_signup: null });
  if (error) alert(error.message); else loadCats();
}

const slug = s => s.toLowerCase().normalize("NFKD").replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").replace(/^([0-9])/, "c$1").slice(0, 30) || "category";

function openForm(key, name) {
  const c = cats.find(x => x.key === key);
  form = c ? { ...c, subs: [...(c.subs || [])], isNew: false }
    : { key: "", name: name || "", name_hi: "", short_line: "", icon: "shopping_cart", color: COLORS[0], subs: [], visible: false, allow_signup: true, isNew: true };
  renderForm();
}

function renderForm() {
  const f = form, p = $("#panel");
  p.classList.add("open"); document.body.classList.add("po");
  p.innerHTML = `<h2><span>${f.isNew ? "New category" : "Edit category"}</span><button class="x" onclick="closeForm()">×</button></h2>
    <label>NAME (ENGLISH)</label><input class="in" id="f-name" value="${esc(f.name)}" placeholder="e.g. Bakery">
    <label>NAME (हिंदी)</label><input class="in" id="f-hi" value="${esc(f.name_hi)}" placeholder="e.g. बेकरी">
    <label>SHORT LINE (WEBSITE CARD)</label><input class="in" id="f-line" value="${esc(f.short_line)}" placeholder="e.g. Bread, cakes, cookies & rusk">
    <label>ICON</label><div class="icons">${ICONS.map(i => `<button class="${f.icon === i ? "on" : ""}" onclick="setF('icon','${i}')" title="${i}"><img src="${iconSrc(i)}" alt=""></button>`).join("")}
      <button title="Upload your own" onclick="$('#up').click()" class="${/^https?:/.test(f.icon) ? "on" : ""}">${/^https?:/.test(f.icon) ? `<img src="${esc(f.icon)}">` : "⇪"}</button>
      <input type="file" id="up" accept="image/png,image/webp,image/jpeg" style="display:none" onchange="upload(this)"></div>
    <label>CARD COLOUR</label><div class="sw">${COLORS.map(c => `<button style="background:${c}" class="${f.color === c ? "on" : ""}" onclick="setF('color','${c}')"></button>`).join("")}
      <input class="in" style="width:110px;padding:6px 10px" value="${esc(f.color)}" onchange="setF('color', this.value)"></div>
    <label>SUB-CATEGORIES</label><div class="chips">${f.subs.map((s, i) => `<span class="chip" title="Remove" onclick="form.subs.splice(${i},1);keepTyped();renderForm()">${esc(s)} ×</span>`).join("")}
      <span class="chip add" onclick="addSub()">＋ Add</span></div>
    <div class="row"><div><b>Show to customers</b><span>Off = draft</span></div><button class="tog ${f.visible ? "on" : ""}" onclick="setF('visible', ${!f.visible})"></button></div>
    <div class="row" style="margin-top:0"><div><b>Allow shop sign-ups</b><span>Shops can pick this type</span></div><button class="tog ${f.allow_signup ? "on" : ""}" onclick="setF('allow_signup', ${!f.allow_signup})"></button></div>
    <div class="note"><b>Cards are made automatically</b> from name + icon + colour — app home, Categories, seller sign-up &amp; website.</div>
    <div class="msg" id="fm"></div>
    <button class="btn pink full" onclick="saveForm()">Save category</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="closeForm()">Cancel</button>
    ${f.isNew ? "" : `<button class="btn full" style="margin-top:8px;background:#FFE4EC;color:#BE185D" onclick="delCat('${f.key}')">Delete category</button>
      <div class="sub" style="margin-top:6px;font-size:11.5px">Only a category with no shops can be deleted. Otherwise switch “Show to customers” off.</div>`}`;
}
function keepTyped() { if (!$("#f-name")) return; form.name = $("#f-name").value; form.name_hi = $("#f-hi").value; form.short_line = $("#f-line").value; }
function setF(k, v) { keepTyped(); form[k] = v; renderForm(); }
function addSub() { const s = prompt("Sub-category name (e.g. Cakes)"); if (s && s.trim()) { keepTyped(); form.subs.push(s.trim()); renderForm(); } }
function closeForm() { $("#panel").classList.remove("open"); document.body.classList.remove("po"); form = null; }

async function upload(inp) {
  const file = inp.files[0]; if (!file) return;
  if (file.size > 400 * 1024) return alert("Please use an image under 400 KB (square PNG/WebP works best).");
  keepTyped();
  const { data: { user } } = await db.auth.getUser();
  const path = `${user.id}/categories/${Date.now()}.${(file.name.split(".").pop() || "png").toLowerCase()}`;
  const { error } = await db.storage.from("public").upload(path, file, { upsert: true, contentType: file.type });
  if (error) return alert(error.message);
  form.icon = `${SB}/storage/v1/object/public/public/${path}`; renderForm();
}

async function delCat(key) {
  if ((counts[key] || 0) > 0) return alert(`${counts[key]} shop(s) use this category. Switch "Show to customers" off instead.`);
  if (!confirm("Delete this category for good?")) return;
  const { error } = await db.rpc("admin_delete_category", { p_key: key });
  if (error) return alert(error.message);
  closeForm(); loadCats();
}
async function saveForm() {
  keepTyped();
  const f = form, m = $("#fm");
  if (!f.name.trim()) { m.className = "msg err"; m.textContent = "Name is required"; return; }
  const key = f.isNew ? slug(f.name) : f.key;
  if (f.isNew && cats.some(c => c.key === key)) { m.className = "msg err"; m.textContent = `"${key}" already exists — edit that one instead.`; return; }
  const { error } = await db.rpc("admin_save_category", { p: { key, name: f.name.trim(), name_hi: f.name_hi, short_line: f.short_line, icon: f.icon,
    color: f.color, subs: f.subs, visible: f.visible, allow_signup: f.allow_signup } });
  if (error) { m.className = "msg err"; m.textContent = error.message; return; }
  closeForm(); loadCats();
}

start();
</script>
</body></html>
